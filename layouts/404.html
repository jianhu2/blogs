
{{ define "main"}}
{{ $isMultiLingual := and (not .Site.Language.IsDefault) (and hugo.IsMultilingual (not .Site.Params.Site.OnlyOneLang)) }}
    <main>
        <div class="circle-404">
            <div class="root-404">
                <div class="c404"></div>
                <div class="titleroot-404">
                    <div class="title-404">4</div>
                    <div class="title-404">4</div>
                </div>
            </div>
        <div class="back">
            <div>{{ i18n "_404_sorry" }}</div>
            <a href='{{- if $isMultiLingual -}}{{ .Site.Language.Name | relURL }}{{- else -}}{{ "/" | relURL }}{{- end -}}' class="efct-button">{{ i18n "_404_backToHome" }}</a>
        </div>
        </div>
    </main>
{{ end }}
